panels.forEach(p=>{const el=document.createElement('section');el.className='card'+(p.tab==='oecd'?' wide':'');el.dataset.tab=p.tab;
el.innerHTML='<h2>'+p.title+'</h2><div class="note">'+p.note+'</div><div class="legend">'+p.series.filter(s=>s.data.length).map(s=>{const l=s.data[s.data.length-1];const d=new Date(l[0]);const now=new Date();const lag=(now.getUTCFullYear()-d.getUTCFullYear())*12+now.getUTCMonth()-d.getUTCMonth();const cls=lag>=6?'late':lag>=3?'warn':'';return '<span class="'+cls+'"><i style="background:'+s.color+'"></i>'+s.name+' <b>'+fmt(l[1])+p.unit+'</b> <small class="note">'+(cls?'⚠ ':'')+d.toLocaleString('en-GB',{month:'short',year:'2-digit',timeZone:'UTC'})+'</small></span>';}).join('')+'</div><div class="chart" id="chart-'+p.id+'"></div>';root.appendChild(el);});
function draw(){if(!window.Highcharts){const s=document.querySelector('.status');s.hidden=false;s.textContent='Charts could not load. Please refresh.';return;}
document.querySelectorAll('.card').forEach(c=>c.hidden=c.dataset.tab!==tab);
const cut=new Date();cut.setUTCFullYear(cut.getUTCFullYear()-years);
panels.filter(p=>p.tab===tab).forEach(p=>{
Highcharts.chart('chart-'+p.id,{chart:{type:'line',backgroundColor:'transparent',animation:false,style:{fontFamily:'inherit'},zoomType:'x'},title:{text:null},credits:{enabled:false},legend:{enabled:false},accessibility:{enabled:false},
xAxis:{type:'datetime',lineColor:'#dce1e2',tickLength:0,labels:{style:{fontSize:'11px',color:'#747e80'}}},
yAxis:{title:{text:null},gridLineColor:'#edf0f1',labels:{format:'{value}'+p.unit,style:{fontSize:'11px',color:'#747e80'}},plotLines:p.zero?[{value:0,color:'#9aa5a7',width:1,zIndex:3}]:[]},
tooltip:{shared:true,formatter(){return '<b>'+Highcharts.dateFormat('%b %Y',this.x)+'</b><br>'+this.points.slice().sort((a,b)=>b.y-a.y).map(q=>'<span style="color:'+q.color+'">\u25CF</span> '+q.series.name+': '+fmt(q.y)+p.unit).join('<br>');}},
plotOptions:{series:{animation:false,lineWidth:2.2,states:{hover:{lineWidthPlus:0}},turboThreshold:0,marker:{enabled:false}}},
series:p.series.map(s=>({name:s.name,color:s.color,dashStyle:s.dash||'Solid',data:s.data.filter(d=>d[0]>=cut.getTime())}))});});}
document.querySelectorAll('[data-tab]').forEach(b=>{if(b.tagName==='BUTTON')b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));draw();};});
document.querySelectorAll('[data-years]').forEach(b=>b.onclick=()=>{years=+b.dataset.years;document.querySelectorAll('#ranges button').forEach(x=>x.classList.toggle('active',x===b));draw();});
draw();
if(window.self!==window.top){document.querySelector('header .heading').hidden=true;document.body.style.background='transparent';document.querySelector('header').style.cssText='background:transparent;border:0;padding:0 0 4px';
const fit=()=>{try{window.parent.document.getElementById('macro-frame').style.height=(document.documentElement.scrollHeight+10)+'px';}catch(e){}};
new ResizeObserver(fit).observe(document.body);fit();}
</script></body></html>
