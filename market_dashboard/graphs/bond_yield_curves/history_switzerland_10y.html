            }
        }],
        navigator: {
            enabled: true
        },
        scrollbar: {
            enabled: true
        },
        credits: {
            enabled: false
        },
        exporting: {
            buttons: {
                contextButton: {
                    menuItems: ['viewFullscreen', 'separator', 'downloadPNG', 'downloadJPEG', 'downloadPDF', 'downloadSVG']
                }
            }
        }
    });

    // Reflow chart on window resize
    window.addEventListener('resize', function() {
        chart.reflow();
    });
    </script>
